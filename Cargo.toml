[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Bevy is slow to compile unoptimised; optimise deps even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The solver is a workspace member, so "*" doesn't cover it; keep it fast in dev.
[profile.dev.package.rutot-core]
opt-level = 3
